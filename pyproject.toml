[project]
name = "redes-neuronales-ii"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gggelme", email = "gelmettisantiago@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "torch>=2.11.0",
    "torch-geometric>=2.8.1",
    "torchaudio>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.70.0",
    "transformers>=5.20.2",
    "umap-learn>=0.5.12",
]

[project.scripts]
redes-neuronales-ii = "redes_neuronales_ii:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
